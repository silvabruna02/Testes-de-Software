name: testes

on: [push, pull_request]

jobs:
  testes:
    # Playwright 1.56 ainda não oferece suporte ao Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contas
          POSTGRES_PASSWORD: contas
          POSTGRES_DB: contas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contas -d contas_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://contas:contas@localhost:5432/contas_teste
      DATABASE_URL_TESTE: postgresql://contas:contas@localhost:5432/contas_teste
      DATABASE_URL_E2E: postgresql://contas:contas@localhost:5432/contas_teste
      BASE_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes unitários
        run: python -m pytest -m unit --cov=app --cov-branch --cov-report=term-missing

      - name: Mutação das regras (Aula 2)
        run: python validar_testes.py

      - name: Testes de banco e de integração
        run: python -m pytest -m "banco or integracao" --cov=app --cov-branch --cov-report=term-missing

      - name: Mutação das funções do banco (Aula 4)
        run: python validar_testes.py banco

      - name: Instalar Chromium (Aula 5)
        run: python -m playwright install --with-deps chromium

      - name: Iniciar aplicação para E2E
        run: |
          python migrar.py
          nohup python -m flask --app app.web run --host 127.0.0.1 --port 8000 > /tmp/app.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --fail http://127.0.0.1:8000/login; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1

      - name: Testes ponta a ponta (Aula 5)
        run: python -m pytest -m e2e -v

      - name: Testes de aceitação (Aula 6)
        run: python -m pytest -m aceitacao -v
